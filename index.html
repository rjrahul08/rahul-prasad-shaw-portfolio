        }

        .cursor-dot,

            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;

        // --- ANIMATION HOOKS (Reusable Systems) ---

        // 1. Hook for Reveal on Scroll
        const useScrollReveal = (threshold = 0.1) => {
            const ref = React.useRef(null);
            React.useEffect(() => {
                const el = ref.current;
                if (!el) return;
                
                gsap.fromTo(el, 
                    { opacity: 0, y: 30 },
                    {
                        opacity: 1, 
                        y: 0, 
                        duration: 0.8, 
                        ease: "power3.out",
                        scrollTrigger: {
                            trigger: el,
                            start: `top ${100 - (threshold * 100)}%`,
                            toggleActions: "play none none reverse"
                        }
                    }
                );
            }, [threshold]);
            return ref;
        };

        // 2. Hook for 3D Tilt Effect
        const useTilt = (active = true) => {
            const ref = React.useRef(null);

            React.useEffect(() => {
                if (!active || !ref.current) return;
                
                const el = ref.current;
                const handleMove = (e) => {
                    const rect = el.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -8;
                    const rotateY = ((x - centerX) / centerX) * 8;

                    gsap.to(el, {
                        rotateX,
                        rotateY,
                        scale: 1.02,
                        duration: 0.4,
                        ease: "power2.out",
                        transformPerspective: 1000
                    });
                };

                const handleLeave = () => {
                    gsap.to(el, {
                        rotateX: 0,
                        rotateY: 0,
                        scale: 1,
                        duration: 0.6,
                        ease: "elastic.out(1, 0.5)"
                    });
                };

                el.addEventListener("mousemove", handleMove);
                el.addEventListener("mouseleave", handleLeave);
                return () => {
                    el.removeEventListener("mousemove", handleMove);
                    el.removeEventListener("mouseleave", handleLeave);
                };
            }, [active]);

            return ref;
        };

        // --- CORE COMPONENTS ---

        const CustomCursor = () => {
            const cursorDot = React.useRef(null);
            const cursorOutline = React.useRef(null);

            React.useEffect(() => {
                // Only enable on desktop
                if (window.matchMedia("(hover: none)").matches) return;

                const moveCursor = (e) => {
                    const { clientX, clientY } = e;
                    gsap.to(cursorDot.current, { x: clientX, y: clientY, duration: 0.1 });
                    gsap.to(cursorOutline.current, { x: clientX, y: clientY, duration: 0.25, ease: "power2.out" });
                };

                window.addEventListener("mousemove", moveCursor);
                return () => window.removeEventListener("mousemove", moveCursor);
            }, []);

            return (
                <div className="hidden md:block pointer-events-none fixed inset-0 z-[9999]">
                    <div ref={cursorDot} className="absolute w-2 h-2 bg-white rounded-full -translate-x-1/2 -translate-y-1/2 mix-blend-difference" />
                    <div ref={cursorOutline} className="absolute w-10 h-10 border border-white/30 rounded-full -translate-x-1/2 -translate-y-1/2 transition-[width,height] duration-200" />
                </div>
            );
        };

        const ScrollProgress = () => {
            const [progress, setProgress] = React.useState(0);
            React.useEffect(() => {
                const handleScroll = () => {
                    const total = document.documentElement.scrollTop;
                    const windowHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    setProgress(total / windowHeight);
                }
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            return (
                <div className="fixed top-0 left-0 h-0.5 bg-blue-500 z-[100] transition-all duration-100 ease-out" style={{ width: `${progress * 100}%` }}></div>
            );
        };

        const MagneticButton = ({ children, className = "" }) => {
            const btnRef = React.useRef(null);

                const btn = btnRef.current;
                const moveBtn = (e) => {
                    const rect = btn.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    gsap.to(btn, { x: x * 0.3, y: y * 0.3, duration: 0.3, ease: "power2.out" });
                };
                const leaveBtn = () => gsap.to(btn, { x: 0, y: 0, duration: 0.5, ease: "elastic.out(1, 0.3)" });
                btn.addEventListener("mousemove", moveBtn);
                btn.addEventListener("mouseleave", leaveBtn);
                return () => {
                    btn.removeEventListener("mousemove", moveBtn);
                    btn.removeEventListener("mouseleave", leaveBtn);
                };
            }, []);
            return <button ref={btnRef} className={className}>{children}</button>;

        const AISystemViz = () => {
            const pathRef = React.useRef(null);
            
            React.useEffect(() => {
                const path = pathRef.current;
                const length = path.getTotalLength();
                
                // Set initial dash array to simulate data packets (dashes moving along the line)
                gsap.set(path, {
                    strokeDasharray: "10 50", // 10px dash, 50px gap
                    strokeDashoffset: length
                });

                gsap.to(path, {
                    strokeDashoffset: 0,
                    duration: 3,
                    repeat: -1,
                    ease: "none"
                });

                // Pulse nodes
                gsap.to(".node-ring", {
                    scale: 1.5,
                    opacity: 0,
                    duration: 2,
                    repeat: -1,
                    stagger: 0.5,
                    ease: "power1.out"

            return (
                <section id="skills" className="py-32 bg-black border-y border-white/5 relative overflow-hidden">
                    <div className="container mx-auto px-6 md:px-12 grid lg:grid-cols-2 gap-16 items-center">
                        <div className="relative aspect-video bg-white/5 rounded-xl border border-white/10 p-8 overflow-hidden">
                            <div className="absolute inset-0 grid-bg opacity-30" />
                            
                            <svg viewBox="0 0 600 300" className="w-full h-full">
                                {/* Base Path (dim) */}
                                <path d="M 50 150 L 200 150 C 250 150 250 100 300 100 L 450 100 C 500 100 500 200 550 200" 
                                      fill="none" stroke="#333" strokeWidth="2" />
                                
                                {/* Active Data Stream Path */}
                                <path ref={pathRef} 
                                      d="M 50 150 L 200 150 C 250 150 250 100 300 100 L 450 100 C 500 100 500 200 550 200" 
                                      fill="none" stroke="#3b82f6" strokeWidth="3" filter="drop-shadow(0 0 4px #3b82f6)" />
